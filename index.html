<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Racha de Cálculo</title>
  <meta name="description" content="Un ejercicio al día para ir al día con Cálculo.">
  <meta name="theme-color" content="#007ba7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeo.
    try {
      var t = localStorage.getItem('tema');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden></div>

  <header class="topbar">
    <a class="brand" href="#/">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <span>Racha de Cálculo</span>
    </a>
    <div class="topbar-actions">
      <select id="course-select" class="course-select" aria-label="Curso" hidden></select>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar modo claro/oscuro" title="Modo claro/oscuro">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12.3 2a10 10 0 1 0 9.7 12.7 8 8 0 0 1-9.7-12.7Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
      </button>
      <button id="logout" class="icon-btn" type="button" aria-label="Cerrar sesión" title="Cerrar sesión" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <nav id="tabs" class="tabs" hidden>
    <a href="#/" data-tab="hoy">Hoy</a>
    <a href="#/ranking" data-tab="ranking">Ranking</a>
    <a href="#/historial" data-tab="historial">Mis ejercicios</a>
    <a href="#/reglas" data-tab="reglas">Reglas</a>
    <a href="#/profe" data-tab="profe" class="tab-profe" hidden>Profe</a>
  </nav>

  <main id="app" class="container">
    <div class="loading">Cargando…</div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
